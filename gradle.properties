# 注解处理（KSP + Room）会让编译器在 metaspace 里多装载一整套符号与生成器。
# 512m 在这个工程上已经不够，编译会在 Metaspace 上直接失败而不是给出可读的编译错误，
# 因此两侧都放宽：Gradle 守护进程负责装载编译插件，Kotlin 守护进程负责实际编译。
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1536m

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
